<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>상품 추천</title>
  <style>
    :root{
      --brand:#0f4c81;
      --brand-light:#e8f0fb;
      --brand-dark:#0a3560;
      --bg:#f8f9fb;
      --text:#1a1f2e;
      --muted:#9aa0b2;
      --line:#e8ecf2;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",Arial,sans-serif;color:var(--text);font-size:16px}
    .app{max-width:480px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column}

    /* 헤더 */
    header{
      padding:16px 20px 12px;
      border-bottom:1px solid var(--line);
      background:#fff;
      position:sticky;top:0;z-index:10;
    }
    .header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .header-title{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px}
    .track-badge{
      font-size:11px;font-weight:700;
      padding:3px 10px;border-radius:99px;
      background:var(--brand-light);color:var(--brand-dark);
    }
    .track-badge.pro{background:#ffeee9;color:#e85d2f}
    .track-badge.wholesale{background:#e6f7ef;color:#1a7a4a}
    .progress-row{display:flex;align-items:center;gap:10px}
    .step-count{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;flex-shrink:0}
    .progress-wrap{flex:1;height:4px;background:#eee;border-radius:99px;overflow:hidden}
    .progress{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-dark));transition:.3s ease;border-radius:99px}

    /* 본문 */
    main{padding:24px 20px 36px;flex:1}
    .question-title{font-size:19px;font-weight:900;line-height:1.35;letter-spacing:-.6px;margin-bottom:6px}
    .question-desc{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:20px}

    /* 옵션 */
    .options{display:grid;gap:8px}
    .option{
      width:100%;border:1.5px solid var(--line);background:#fff;
      border-radius:12px;padding:13px 16px;
      text-align:left;cursor:pointer;
      transition:border-color .15s,background .15s,transform .1s;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .option:active{transform:scale(.98)}
    .option:hover{border-color:var(--brand);background:var(--brand-light)}
    .option-body{flex:1;min-width:0}
    .option-label{display:block;font-size:14px;font-weight:700;margin-bottom:2px;color:var(--text)}
    .option-sub{display:block;font-size:12px;color:var(--muted);line-height:1.4}
    .option-arrow{color:#ccc;font-size:18px;flex-shrink:0;font-weight:300}

    /* 하단 네비 */
    .nav{display:flex;gap:8px;margin-top:20px}
    .btn{flex:1;border:none;border-radius:10px;padding:12px 10px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
    .btn-back{background:#f2f2f2;color:#555}
    .btn-back:hover{background:#e8e8e8}
    .btn-reset{background:#0f4c81;color:#fff}

    /* 결과 */
    .answer-summary{
      background:var(--bg);border-radius:10px;
      padding:10px 14px;font-size:12px;color:var(--muted);
      line-height:1.7;margin-bottom:16px;
    }
    .answer-summary span{color:var(--text);font-weight:700}
    .result-eyebrow{
      font-size:11px;font-weight:800;letter-spacing:.5px;
      color:var(--brand);text-transform:uppercase;margin-bottom:8px;
    }
    .result-card{
      background:#fff;border:1.5px solid var(--line);
      border-radius:14px;padding:18px 20px;margin-bottom:10px;
    }
    .result-card.top-card{border-color:var(--brand)}
    .rank-badge{
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:99px;
      background:var(--brand);color:#fff;
      font-weight:800;font-size:11px;margin-bottom:10px;
    }
    .product-name-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
    .product-name{font-size:20px;font-weight:900;letter-spacing:-.6px;flex:1;}
    .fit-label{
      display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
      font-size:12px;font-weight:700;padding:3px 10px;
      border-radius:99px;
    }
    .fit-excellent{background:#e6f4ee;color:#1a6e3c}
    .fit-good{background:#e8f0fe;color:#1a56c4}
    .fit-fair{background:#f5f5f5;color:#555}
    .reason-list{margin:0;padding:0;list-style:none}
    .reason-list li{
      font-size:13px;line-height:1.65;
      padding:7px 0 7px 18px;position:relative;
      border-top:1px solid var(--line);color:#333;
    }
    .reason-list li:first-child{border-top:none}
    .reason-list li::before{content:"·";position:absolute;left:4px;color:var(--brand);font-weight:900;font-size:18px;line-height:1.2}
    .alt-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 0;border-top:1px solid var(--line);font-size:13px;
    }
    .alt-row:first-child{border-top:none}
    .alt-name{font-weight:700}
    .alt-fit{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
    .warning-box{
      background:#fffbf0;border:1px solid #f5d87a;
      color:#5a3800;border-radius:10px;
      padding:13px 15px;font-size:13px;line-height:1.65;
    }
    .warning-box p{margin:0 0 7px}
    .warning-box p:last-child{margin-bottom:0}
    .small-note{color:var(--muted);font-size:11px;line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
    .cta{display:grid;gap:8px;margin-top:18px}
    .btn-primary{
      width:100%;border:none;border-radius:12px;padding:14px;
      font-size:15px;font-weight:800;cursor:pointer;
      background:var(--brand);color:#fff;transition:.15s;
    }
    .btn-primary:hover{background:var(--brand-dark)}
    .btn-secondary{
      width:100%;border:none;border-radius:12px;padding:14px;
      font-size:15px;font-weight:700;cursor:pointer;
      background:#0f4c81;color:#fff;
    }
    .btn-outline{
      width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;
      font-size:14px;font-weight:700;cursor:pointer;background:#fff;color:#5a6378;
    }
    .toast{
      position:fixed;bottom:28px;left:50%;
      transform:translateX(-50%) translateY(16px);
      background:#0f4c81;color:#fff;
      padding:10px 20px;border-radius:99px;
      font-size:13px;font-weight:700;
      opacity:0;transition:.3s;white-space:nowrap;z-index:100;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* 전문가 트랙 결과: 오렌지 계열 */
    .result-pro .result-eyebrow{color:#e85d2f}
    .result-pro .rank-badge{background:linear-gradient(90deg,#e85d2f,#ff7a4d)}
    .result-pro .result-card.top-card{border-color:#e85d2f}
    .result-pro .reason-list li::before{color:#e85d2f}
    .result-pro .btn-primary{background:#e85d2f}
    .result-pro .btn-primary:hover{background:#c44020}

    /* 결과 제품 이미지 */
    .result-product-img{
      width:100%;height:160px;border-radius:8px;overflow:hidden;
      background:linear-gradient(135deg,#e8f0fb,#c8daf5);
      margin-bottom:14px;
    }
    .result-product-img img{width:100%;height:100%;object-fit:cover;display:block;}
    .result-pro .result-product-img{background:linear-gradient(135deg,#fff2ee,#ffd5c5);}
  </style>
</head>

/* ══════════════════════════════════════
   트랙별 질문 순서
══════════════════════════════════════ */
const FLOW = {
  diy:       ["role","diy_problem","diy_part","diy_priority","diy_thickness"],
  pro:       ["role","pro_regulation","pro_part","pro_priority","pro_thickness"],
  wholesale: ["role"],
};

/* ══════════════════════════════════════
   상태
══════════════════════════════════════ */
let track = null;
let stepIdx = 0;
let answers = {};
let _wizardResult = null;

function currentFlow(){ return FLOW[track] || ["role"] }
function currentKey(){ return currentFlow()[stepIdx] }
function totalSteps(){ return currentFlow().length }

/* ══════════════════════════════════════
   점수 계산
══════════════════════════════════════ */
function calcScores(){
  const scores = {};
  Object.keys(PRODUCTS).forEach(k => scores[k] = 0);

  currentFlow().forEach(key => {
    if(answers[key] === undefined) return;
    const q = Q[key];
    const opt = q.options[answers[key]];
    if(!opt.score) return;
    Object.keys(opt.score).forEach(p => scores[p] += opt.score[p]);
  });

  Object.keys(scores).forEach(p => { if(scores[p] < 0) scores[p] = -999; });

  Object.keys(PRODUCTS).forEach(p => {
    if(track && !PRODUCTS[p].track.includes(track)) scores[p] = -999;
  });

  const sorted = Object.entries(scores).filter(([,v])=>v>=0).sort((a,b)=>b[1]-a[1]);
  if(sorted.length > 0 && (sorted[0][0]==="reflective" || sorted[0][0]==="wallpaper")){
    if(sorted.length > 1) scores[sorted[0][0]] = sorted[1][1] - 1;
  }

  return scores;
}

function getLabel(key){
  if(answers[key]===undefined) return "";
  return Q[key].options[answers[key]].label;
}

function fitLabel(score, max){
  const r = max > 0 ? score/max : 0;
  if(r >= 0.85) return {text:"매우 적합", cls:"fit-excellent"};
  if(r >= 0.65) return {text:"적합",      cls:"fit-good"};
  return               {text:"참고 가능", cls:"fit-fair"};
}

/* ══════════════════════════════════════
   렌더링
══════════════════════════════════════ */
function render(){
  const app = document.getElementById("app");
  const prog = document.getElementById("progress");
  const sc = document.getElementById("stepCount");
  const tb = document.getElementById("trackBadge");

  const flow = currentFlow();
  const total = flow.length;
  const pct = Math.round(stepIdx / total * 100);
  prog.style.width = pct + "%";

  if(track === "diy"){
    tb.style.display = ""; tb.textContent = "DIY"; tb.className = "track-badge";
    prog.style.background = "linear-gradient(90deg,#0f4c81,#1a6bb5)";
  } else if(track === "pro"){
    tb.style.display = ""; tb.textContent = "전문가"; tb.className = "track-badge pro";
    prog.style.background = "linear-gradient(90deg,#e85d2f,#ff7a4d)";
  } else if(track === "wholesale"){
    tb.style.display = ""; tb.textContent = "도매문의"; tb.className = "track-badge wholesale";
    prog.style.background = "linear-gradient(90deg,#1a7a4a,#2aad6a)";
  } else {
    tb.style.display = "none";
    prog.style.background = "linear-gradient(90deg,var(--brand),var(--brand-dark))";
  }

  if(stepIdx >= total){
    prog.style.width = "100%";
    sc.textContent = "완료";
    if(track === "wholesale"){ renderWholesale(app); } else { renderResult(app); }
    return;
  }

  sc.textContent = `${stepIdx+1} / ${total}`;
  const q = Q[currentKey()];

  app.innerHTML = `
    <p class="question-title">${q.title}</p>
    <p class="question-desc">${q.desc}</p>
    <div class="options">
      ${q.options.map((o,i) => `
        <button class="option" onclick="selectOption(${i})">
          <span class="option-body">
            <span class="option-label">${o.label}</span>
            <span class="option-sub">${o.sub}</span>
          </span>
          <span class="option-arrow">›</span>
        </button>
      `).join("")}
    </div>
    <div class="nav">
      ${stepIdx > 0 ? `<button class="btn btn-back" onclick="goBack()">← 이전</button>` : ""}
      <button class="btn btn-reset" onclick="restart()">처음부터</button>
    </div>
  `;
}

function selectOption(i){
  const key = currentKey();
  answers[key] = i;

  if(key === "role"){
    const next = Q.role.options[i].next;
    track = next;
  }

  stepIdx++;
  render();
}

function goBack(){
  if(stepIdx > 0){
    stepIdx--;
    if(stepIdx === 0){ track = null; delete answers.role; }
    render();
  }
}

function restart(){
  track = null; stepIdx = 0; answers = {};
  render();
}

/* ══════════════════════════════════════

══════════════════════════════════════ */

/* ══════════════════════════════════════

══════════════════════════════════════ */
function renderResult(app){
  const scores = calcScores();
  const valid = Object.entries(scores).filter(([,v])=>v>=0).sort((a,b)=>b[1]-a[1]);

  if(valid.length === 0){
    app.innerHTML = `
      <p class="question-title">조건을 다시 확인해 주세요</p>

        <button class="btn-primary" onclick="goEstimate()">상담 요청하기</button>
        <button class="btn-outline" onclick="restart()">다시 추천받기</button>
      </div>`;
    return;
  }

  const [topKey, topScore] = valid[0];
  const topProduct = PRODUCTS[topKey];
  const topFit = fitLabel(topScore, topScore);

  const reasons = makeReasons(topKey);
  const warnings = makeWarnings();
  _wizardResult = topProduct.name;

  const summaryKeys = currentFlow().slice(1);
  const summaryParts = summaryKeys.map(k => getLabel(k)).filter(Boolean);

  app.innerHTML = `
    <div class="${track === 'pro' ? 'result-pro' : 'result-diy'}">

        ${warnings.map(w=>`<li>${w}</li>`).join("")}
      </ul>
    </div>` : ""}

    <div class="cta">
      <button class="btn-primary" onclick="goToCatalog()">상품 보러가기</button>
      <button class="btn-secondary" onclick="goToEstimate()">견적 문의하기</button>
      <button class="btn-outline" onclick="restart()">다시 추천받기</button>
    </div>
    </div>
  `;
  window.parent.postMessage({ action: 'getProductImage', productName: topProduct.name }, '*');
}

/* ══════════════════════════════════════

══════════════════════════════════════ */

function goEstimate(){
  window.parent.postMessage({ action:'showPage', page:'estimate' }, '*');
  showToast('견적 요청 페이지로 이동합니다.');
}
function goToCatalog(){
  if(!_wizardResult) return;
  window.parent.postMessage({ action:'showCatalogCategory', category:_wizardResult }, '*');
}
function goToEstimate(){
  if(!_wizardResult) return;
  window.parent.postMessage({ action:'showEstimateWithProduct', productName:_wizardResult }, '*');
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2500);
}

window.addEventListener('message', function(e){
  if(!e.data || e.data.action !== 'productImage') return;
  const wrap = document.getElementById('resultProductImg');
  if(!wrap) return;
  if(!e.data.imageUrl){ return; }
  const img = new Image();
  img.onload = function(){
    wrap.innerHTML = '';
    wrap.appendChild(img);
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
  };
  img.src = e.data.imageUrl;
  img.alt = e.data.productName || '';
});

render();
